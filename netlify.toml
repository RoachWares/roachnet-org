[build]
publish = "website-main-dist"
command = "npm run build:main:deploy"

[functions]
directory = "netlify/functions"

[[redirects]]
from = "/apps"
to = "https://apps.roachnet.org/"
status = 301
force = true

[[redirects]]
from = "/apps/*"
to = "https://apps.roachnet.org/:splat"
status = 301
force = true

[[redirects]]
from = "/iOS"
to = "/ios/"
status = 301
force = true

[[redirects]]
from = "/iOS/*"
to = "/ios/:splat"
status = 301
force = true

[[redirects]]
from = "/brew"
to = "/brew/"
status = 301
force = true

[[redirects]]
from = "/brew/*"
to = "/brew/:splat"
status = 301
force = true

[[redirects]]
from = "/sitemap"
to = "/sitemap/"
status = 301
force = true

[[redirects]]
from = "/sitemap.html"
to = "/sitemap/"
status = 301
force = true

[[redirects]]
from = "/roachwares"
to = "https://www.roachwares.org/"
status = 301
force = true

[[redirects]]
from = "/roachwares/*"
to = "https://www.roachwares.org/:splat"
status = 301
force = true

[[redirects]]
from = "/account"
to = "https://accounts.roachnet.org/"
status = 301
force = true

[[redirects]]
from = "/account/*"
to = "https://accounts.roachnet.org/:splat"
status = 301
force = true

[[headers]]
for = "/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; base-uri 'none'; connect-src 'self' https://api.github.com https://challenges.cloudflare.com https://*.supabase.co wss://*.supabase.co; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; frame-src https://challenges.cloudflare.com; img-src 'self' data: https:; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com https://cdn.jsdelivr.net; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; worker-src 'self' blob:; upgrade-insecure-requests"
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
